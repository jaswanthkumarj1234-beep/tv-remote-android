plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jaswanth.tvremote'
    compileSdk 34

    defaultConfig {
        applicationId 'com.jaswanth.tvremote'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
